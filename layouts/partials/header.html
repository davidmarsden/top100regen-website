<link rel="stylesheet" href="/top100-family.css">

<style>
  /* Override sticky/fixed positioning inherited from the underlying theme. */
  html body header.site-header,
  html body .site-header,
  html body .site-header .family-bar,
  html body .site-header .header-content {
    position: static !important;
    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    left: auto !important;
    inset: auto !important;
    transform: none !important;
  }

  html body .site-header { z-index: auto !important; }

  /* The parent theme applies a purple background to visited links. */
  html body a:visited,
  html body a:link {
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
    box-shadow: none !important;
  }

  html body .regen-hero h1 {
    color: #fff !important;
    text-shadow: 0 2px 18px rgba(0,0,0,.24);
  }

  html body .regen-hero .button,
  html body .regen-hero .button:link,
  html body .regen-hero .button:visited { color: #fff !important; }

  html body .regen-family--secondary { margin-top: 1.5rem; }

  html body .launch-links {
    display: grid;
    margin-top: .8rem;
    border-top: 1px solid var(--line);
  }

  html body .launch-links a,
  html body .launch-links a:visited {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: .7rem 0;
    border-bottom: 1px solid var(--line);
    color: var(--family-blue-2) !important;
    font-weight: 800;
    text-decoration: none;
  }

  html body .launch-links a:last-child { border-bottom: 0; }
  html body .launch-links span { color: var(--regen-deep); flex: 0 0 auto; }

  html body .rules-history {
    margin: .8rem 0 1.35rem;
    padding: .65rem .85rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #f2f5f8;
    color: var(--muted);
    font-size: .92rem;
  }

  html body .rules-history summary {
    cursor: pointer;
    font-weight: 800;
    color: var(--muted);
  }

  html body .rules-history ul { margin-bottom: .2rem; }

  html body .rules-current-reference {
    margin: 1.5rem 0;
    padding: 1rem 1.1rem;
    border-left: 4px solid var(--regen);
    background: #f2f7ea;
    border-radius: 0 10px 10px 0;
  }

  html body form[action*="/users/subscribe/"] {
    max-width: 560px;
    margin: 1.25rem 0 1rem;
    padding: 1.15rem;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
  }

  html body form[action*="/users/subscribe/"] label { display: block; margin-bottom: .45rem; }

  html body form[action*="/users/subscribe/"] input[type="email"] {
    width: min(100%, 360px);
    padding: .7rem .8rem;
    border: 1px solid #b8c3d1;
    border-radius: 9px;
    font: inherit;
  }

  html body form[action*="/users/subscribe/"] input[type="submit"] {
    margin-left: .35rem;
    padding: .7rem 1rem;
    border: 0;
    border-radius: 999px;
    background: var(--regen);
    color: #17220c;
    font: inherit;
    font-weight: 850;
    cursor: pointer;
  }

  /* Regen is a sister world, not another claim to the Top 100 name. */
  html body .regen-local-header {
    padding-top: 1.65rem;
    padding-bottom: 1.45rem;
  }

  html body .regen-brand {
    align-items: center;
    gap: .9rem;
  }

  html body .regen-mark {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: var(--regen);
    color: #17220c;
    font-weight: 950;
    font-size: 1.35rem;
    letter-spacing: -.06em;
    transform: rotate(-2deg);
  }

  html body .regen-brand__text {
    display: grid;
    gap: .18rem;
    line-height: 1.05;
  }

  html body .regen-brand__family {
    color: var(--muted);
    font-size: .7rem;
    font-weight: 900;
    letter-spacing: .13em;
    text-transform: uppercase;
  }

  html body .regen-brand__name {
    color: var(--ink);
    font-size: 1.55rem;
    font-weight: 950;
    letter-spacing: -.045em;
  }

  html body .regen-brand__text small {
    margin-top: .12rem;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    html body form[action*="/users/subscribe/"] input[type="email"],
    html body form[action*="/users/subscribe/"] input[type="submit"] {
      display: block;
      width: 100%;
      margin: .5rem 0 0;
    }

    html body .regen-local-header {
      padding-top: 1.3rem;
      padding-bottom: 1.2rem;
    }

    html body .regen-mark { width: 46px; height: 46px; font-size: 1.15rem; }
    html body .regen-brand__name { font-size: 1.35rem; }
  }
</style>

<header class="site-header top100-family-shell">
  <div class="family-bar">
    <div class="family-bar__inner">
      <a class="top100-family-brand" href="https://smtop100.micro.blog/" aria-label="Visit Top 100">
        <span class="top100-family-wordmark"><span>Top</span><strong>100</strong></span>
        <span class="top100-family-pitch" aria-hidden="true"><i></i></span>
        <small>Managers. Stories. A bigger game.</small>
      </a>

      <div class="top100-family-product">
        <span>TOP 100</span>
        <strong>Regen</strong>
      </div>

      <nav class="top100-family-nav" aria-label="Top 100 family">
        <a href="https://smtop100.micro.blog/">Top 100</a>
        <a href="https://archive.smtop100.blog/">Stats &amp; History</a>
        <a href="https://youth-cup.smtop100.blog/">Tournaments</a>
        <a href="https://awards.smtop100.blog/">Awards</a>
        <a class="is-current" href="/">Regen</a>
      </nav>
    </div>
  </div>

  <div class="header-content regen-local-header">
    <a href="/" class="regen-brand" title="Regen — home">
      <span class="regen-mark" aria-hidden="true">R</span>
      <span class="regen-brand__text">
        <span class="regen-brand__family">A Top 100 sister world</span>
        <strong class="regen-brand__name">Regen</strong>
        <small>Same DNA. New generation.</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="Regen">
      <a href="/">News</a>
      <a href="/archive/">Archive</a>
      <a href="/rules/">Rules</a>
      <a href="/subscribe/">Subscribe</a>
      <a class="nav-join" href="/join/">Join</a>
    </nav>
  </div>
</header>
